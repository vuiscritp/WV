<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ff6b35" />
<title>Egeo</title>
<style>
  :root {
    --primary: #ff6b35;
    --primary-d: #e85d04;
    --primary-l: #ff9f1c;
    --primary-soft: rgba(255,107,53,.12);
    --primary-soft2: rgba(255,107,53,.07);
    --bg: #f8f9fb;
    --surface: #fff;
    --text: #202124;
    --text2: #5f6368;
    --text3: #80868b;
    --border: #dadce0;
    --shadow: 0 1px 6px rgba(32,33,36,.12);
    --shadow2: 0 4px 16px rgba(32,33,36,.14);
    --radius: 24px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; width:100%; font-family:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
  body { display:flex; flex-direction:column; padding-top:var(--safe-t); }

  .home-top { display:flex; justify-content:flex-end; padding:10px 14px 0; flex-shrink:0; }
  .icon-btn {
    width:40px; height:40px; border:none; background:transparent; border-radius:50%;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:var(--text2); flex-shrink:0; transition:background .15s, color .15s;
  }
  .icon-btn:active { background:var(--primary-soft); color:var(--primary); }
  .icon-btn svg { width:22px; height:22px; fill:currentColor; }

  #viewHome { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; }
  .home-main {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:12px 20px 32px; min-height:0;
  }
  .brand { text-align:center; margin-bottom:28px; user-select:none; pointer-events:none; }
  .brand-name {
    font-size:40px; font-weight:600; letter-spacing:-.8px; line-height:1.15;
    background:linear-gradient(105deg, var(--primary-l), var(--primary), var(--primary-d));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .brand-tag { font-size:12.5px; color:var(--text3); margin-top:6px; }

  .search-wrap { width:100%; max-width:584px; margin-bottom:36px; }
  .search-form {
    display:flex; align-items:center; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); height:52px; transition:box-shadow .2s, border-color .2s;
  }
  .search-form:focus-within {
    border-color:var(--primary);
    box-shadow:0 1px 6px rgba(255,107,53,.22), 0 0 0 1px var(--primary);
  }
  .search-lead { padding:0 10px 0 18px; color:var(--text3); display:flex; flex-shrink:0; }
  .search-lead svg { width:20px; height:20px; fill:currentColor; }
  .search-input {
    flex:1; border:none; outline:none; background:transparent;
    font-size:16px; color:var(--text); min-width:0; height:100%; font-family:inherit;
  }
  .search-input::placeholder { color:#9aa0a6; }
  .search-trail { display:flex; align-items:center; padding-right:8px; gap:2px; flex-shrink:0; }
  .search-go {
    width:40px; height:40px; border:none; border-radius:50%;
    background:linear-gradient(135deg, var(--primary-l), var(--primary));
    color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:opacity .15s, transform .15s;
  }
  .search-go:active { transform:scale(.94); }
  .search-go svg { width:20px; height:20px; fill:currentColor; }

  .shortcuts {
    display:grid; grid-template-columns:repeat(4,1fr); gap:18px 10px;
    width:100%; max-width:400px; margin-bottom:32px;
  }
  .sc {
    display:flex; flex-direction:column; align-items:center; gap:9px;
    text-decoration:none; color:var(--text); border-radius:14px; padding:6px 4px 4px;
    transition:background .15s; user-select:none;
  }
  .sc:active { background:var(--primary-soft2); }
  .sc-icon {
    width:52px; height:52px; border-radius:50%; background:var(--surface);
    box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
    transition:transform .18s, box-shadow .18s; overflow:hidden;
  }
  .sc:active .sc-icon { transform:translateY(-2px); box-shadow:var(--shadow2); }
  .sc-icon svg { width:26px; height:26px; display:block; }
  .sc-label {
    font-size:12.5px; color:var(--text2); text-align:center; max-width:76px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .trending { width:100%; max-width:520px; }
  .trending-head {
    display:flex; align-items:center; gap:7px; margin-bottom:12px;
    font-size:13.5px; font-weight:500; color:var(--text2);
  }
  .trending-head svg { width:16px; height:16px; fill:var(--primary); }
  .trending-chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip {
    appearance:none; border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-size:13px; font-family:inherit; padding:7px 14px;
    border-radius:999px; cursor:pointer; transition:border-color .15s, background .15s, color .15s;
  }
  .chip:active {
    border-color:var(--primary); background:var(--primary-soft); color:var(--primary-d);
  }

  .home-footer {
    flex-shrink:0; padding:12px 16px calc(12px + var(--safe-b));
    text-align:center; font-size:11.5px; color:var(--text3);
  }

  /* Voice overlay */
  .overlay {
    position:fixed; inset:0; background:rgba(32,33,36,.45); z-index:200;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .overlay.show { display:flex; }
  .voice-card {
    background:var(--surface); border-radius:20px; padding:28px; width:100%;
    max-width:300px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.22);
  }
  .voice-mic {
    width:68px; height:68px; border-radius:50%; border:none;
    background:linear-gradient(145deg, var(--primary-l), var(--primary));
    color:#fff; display:flex; align-items:center; justify-content:center;
    margin:0 auto 16px; cursor:pointer; animation:pulse 1.6s ease-in-out infinite;
  }
  .voice-mic svg { width:30px; height:30px; fill:currentColor; }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 0 0 rgba(255,107,53,.45); }
    50% { box-shadow:0 0 0 18px rgba(255,107,53,0); }
  }
  .voice-card h3 { font-size:17px; font-weight:500; margin-bottom:6px; }
  .voice-card p { font-size:13.5px; color:var(--text2); margin-bottom:18px; }
  .voice-close {
    appearance:none; border:1px solid var(--border); background:transparent;
    border-radius:10px; padding:9px 22px; font-size:14px; font-family:inherit;
    color:var(--text); cursor:pointer;
  }

  @media (max-width:400px) {
    .brand-name { font-size:34px; }
    .shortcuts { max-width:340px; gap:14px 6px; }
    .sc-icon { width:48px; height:48px; }
    .sc-icon svg { width:24px; height:24px; }
    .sc-label { font-size:12px; max-width:68px; }
    .search-form { height:48px; }
  }
</style>
</head>
<body>

<div id="viewHome">
  <div class="home-top">
    <button class="icon-btn" id="btnSettings" title="Cài đặt" aria-label="Cài đặt">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.44.17-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </div>

  <div class="home-main">
    <div class="brand">
      <div class="brand-name">Egeo</div>
      <div class="brand-tag">Tìm kiếm</div>
    </div>

    <div class="search-wrap">
      <form class="search-form" id="homeForm" autocomplete="off">
        <div class="search-lead" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
        <input class="search-input" id="homeQ" type="search" placeholder="Tìm kiếm hoặc nhập URL" enterkeyhint="search" spellcheck="false" autofocus />
        <div class="search-trail">
          <button type="button" class="icon-btn" id="btnVoiceHome" title="Giọng nói" aria-label="Giọng nói">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
          </button>
          <button type="submit" class="search-go" title="Tìm kiếm" aria-label="Tìm kiếm">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </div>
      </form>
    </div>

    <div class="shortcuts" id="shortcuts"></div>

    <div class="trending">
      <div class="trending-head">
        <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
        <span>Truy cập nhanh</span>
      </div>
      <div class="trending-chips" id="chips"></div>
    </div>
  </div>

  <div class="home-footer">Egeo</div>
</div>

<div class="overlay" id="voiceOverlay" role="dialog" aria-modal="true">
  <div class="voice-card">
    <button class="voice-mic" id="voiceMic" aria-label="Đang nghe">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
    <h3>Đang nghe…</h3>
    <p>Hãy nói điều bạn muốn tìm</p>
    <button class="voice-close" id="voiceClose">Đóng</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /*
   * Trang này KHÔNG tự tạo kết quả tìm kiếm giả. Khi người dùng tìm kiếm,
   * nó chỉ gọi sang phía Android (window.AndroidBridge) để điều hướng
   * WebView tới công cụ tìm kiếm thật (Google/Bing/Cốc Cốc/DuckDuckGo tuỳ
   * lựa chọn trong Cài đặt). Nếu không chạy trong app Egeo (ví dụ mở file
   * này bằng trình duyệt thường để xem giao diện), nó rơi về window.open.
   */

  const ICONS = {
    youtube: '<svg viewBox="0 0 24 24"><path fill="#FF0000" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 0 12a31.5 31.5 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.5 31.5 0 0 0 24 12a31.5 31.5 0 0 0-.5-5.8z"/><path fill="#fff" d="M9.75 15.5V8.5L15.5 12l-5.75 3.5z"/></svg>',
    gmail: '<svg viewBox="0 0 24 24"><path fill="#EA4335" d="M24 5.5v13.2c0 .9-.7 1.6-1.6 1.6H17V11.2l-5 3.7-5-3.7V20.3H1.6C.7 20.3 0 19.6 0 18.7V5.5l.1-.4L12 14.2 23.9 5.1l.1.4z"/><path fill="#34A853" d="M0 5.5v1.1l7 5.2V1.6H1.6C.7 1.6 0 2.3 0 3.2v2.3z"/><path fill="#4285F4" d="M17 1.6v10.2l7-5.2V3.2c0-.9-.7-1.6-1.6-1.6H17z"/><path fill="#FBBC04" d="M7 11.8l5 3.7 5-3.7V1.6H7v10.2z"/></svg>',
    maps: '<svg viewBox="0 0 24 24"><path fill="#34A853" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z"/><circle fill="#fff" cx="12" cy="9" r="2.8"/></svg>',
    wikipedia: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#000"/><text x="12" y="16.5" font-size="12" text-anchor="middle" fill="#fff" font-family="Georgia,serif">W</text></svg>',
    facebook: '<svg viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.79-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.89v2.26h3.32l-.53 3.49h-2.79V24C19.61 23.1 24 18.1 24 12.07z"/></svg>',
    news: '<svg viewBox="0 0 24 24"><path fill="#FF6B35" d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path fill="#fff" d="M5 7h8v2H5V7zm0 3.5h14v1.5H5v-1.5zm0 3h14v1.5H5V13.5zm0 3h9V18H5v-1.5z"/></svg>',
    more: '<svg viewBox="0 0 24 24"><circle fill="#5f6368" cx="6" cy="12" r="2"/><circle fill="#5f6368" cx="12" cy="12" r="2"/><circle fill="#5f6368" cx="18" cy="12" r="2"/></svg>'
  };

  const SHORTCUTS = [
    { id: "youtube", label: "YouTube", url: "https://www.youtube.com" },
    { id: "gmail", label: "Gmail", url: "https://mail.google.com" },
    { id: "maps", label: "Maps", url: "https://maps.google.com" },
    { id: "wikipedia", label: "Wikipedia", url: "https://vi.wikipedia.org" },
    { id: "facebook", label: "Facebook", url: "https://www.facebook.com" },
    { id: "news", label: "Tin tức", url: "https://news.google.com" }
  ];

  const TRENDS = [
    "thời tiết hôm nay", "giá vàng", "tỷ giá usd", "lịch âm hôm nay"
  ];

  const scRoot = document.getElementById("shortcuts");
  SHORTCUTS.forEach((item) => {
    const a = document.createElement("a");
    a.className = "sc";
    a.href = "#";
    a.innerHTML = '<div class="sc-icon">' + (ICONS[item.id] || ICONS.more) + '</div><span class="sc-label">' + item.label + "</span>";
    a.addEventListener("click", (e) => { e.preventDefault(); openUrl(item.url); });
    scRoot.appendChild(a);
  });

  const chips = document.getElementById("chips");
  TRENDS.forEach((t) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = t;
    b.addEventListener("click", () => doSearch(t));
    chips.appendChild(b);
  });

  function isUrl(str) {
    return /^(https?:\/\/)|^(www\.)|^[a-z0-9-]+(\.[a-z0-9-]+)+(\/|$|\?|:)/i.test(str.trim());
  }

  function openUrl(url) {
    if (window.AndroidBridge && typeof window.AndroidBridge.openUrl === "function") {
      window.AndroidBridge.openUrl(url);
    } else {
      window.open(url, "_blank");
    }
  }

  function doSearch(query) {
    if (window.AndroidBridge && typeof window.AndroidBridge.search === "function") {
      window.AndroidBridge.search(query);
    } else {
      window.open("https://www.google.com/search?q=" + encodeURIComponent(query), "_blank");
    }
  }

  function submitQuery(raw) {
    const q = (raw != null ? raw : homeQ.value).trim();
    if (!q) return;
    if (isUrl(q)) {
      let url = q;
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;
      openUrl(url);
    } else {
      doSearch(q);
    }
  }

  const homeQ = document.getElementById("homeQ");
  document.getElementById("homeForm").addEventListener("submit", (e) => {
    e.preventDefault();
    submitQuery();
  });

  document.getElementById("btnSettings").addEventListener("click", () => {
    if (window.AndroidBridge && typeof window.AndroidBridge.openSettings === "function") {
      window.AndroidBridge.openSettings();
    }
  });

  /* Voice: dùng Web Speech API thật. Cần app Android cấp quyền RECORD_AUDIO
     và WebChromeClient.onPermissionRequest cấp RESOURCE_AUDIO_CAPTURE thì
     mới hoạt động trong WebView; nếu không hỗ trợ, nút sẽ báo rõ thay vì
     giả vờ chạy được. */
  const overlay = document.getElementById("voiceOverlay");
  let recognition = null;
  if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = "vi-VN";
    recognition.interimResults = false;
    recognition.onresult = (ev) => {
      const text = ev.results[0][0].transcript;
      overlay.classList.remove("show");
      submitQuery(text);
    };
    recognition.onerror = () => overlay.classList.remove("show");
    recognition.onend = () => overlay.classList.remove("show");
  }

  function startVoice() {
    if (!recognition) {
      alert("Thiết bị/WebView này không hỗ trợ nhận dạng giọng nói.");
      return;
    }
    overlay.classList.add("show");
    try { recognition.start(); } catch (e) { overlay.classList.remove("show"); }
  }
  function stopVoice() {
    if (recognition) { try { recognition.stop(); } catch (e) {} }
    overlay.classList.remove("show");
  }

  document.getElementById("btnVoiceHome").addEventListener("click", startVoice);
  document.getElementById("voiceClose").addEventListener("click", stopVoice);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) stopVoice(); });

  window.EgeoHome = {
    setQuery: (t) => { homeQ.value = t || ""; }
  };
})();
</script>
</body>
</html>
