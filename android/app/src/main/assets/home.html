<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#202124" />
<title>Egeo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; height: 100dvh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    overflow: hidden; color: #fff; background-color: #1a1a1a;
  }

  .viewport {
    position: relative; width: 100%; height: 100%;
    background-color: #2b1a10;
    background-image: var(--bg-url, url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=70'));
    background-size: cover; background-position: center bottom;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: max(28px, env(safe-area-inset-top)); padding-bottom: 24px;
    overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  }
  .viewport::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: var(--overlay, radial-gradient(circle at 75% 55%, rgba(255,140,50,.14) 0%, rgba(0,0,0,.55) 75%));
    transition: background .25s ease;
  }
  html.no-overlay .viewport::before { background: rgba(0,0,0,.15); }

  .settings-btn {
    position: absolute; top: 14px; right: 16px; z-index: 20;
    color: rgba(255,255,255,.9); padding: 7px; border-radius: 50%;
    background: rgba(0,0,0,.25); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
  }

  .content-container {
    position: relative; z-index: 2; display: flex; flex-direction: column;
    align-items: center; width: 100%; max-width: 640px; padding: 0 20px; margin: auto 0;
  }

  .logo-container { text-align: center; margin-bottom: 22px; }
  .logo-title {
    font-size: 46px; font-weight: 700; letter-spacing: -.5px; line-height: 1.1;
    background: linear-gradient(135deg, #ff7b25 0%, #ff5213 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 20px rgba(255,82,19,.25);
  }
  .logo-sub { font-size: 14px; color: rgba(255,255,255,.85); margin-top: 4px; letter-spacing: .4px; }

  .search-wrapper { width: 100%; max-width: 560px; margin-bottom: 30px; }
  .search-box {
    display: flex; align-items: center; background: rgba(255,255,255,.93);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 28px; padding: 5px 6px 5px 18px;
    box-shadow: 0 8px 28px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.16);
    transition: box-shadow .2s ease; width: 100%;
  }
  .search-box:focus-within { background: #fff; box-shadow: 0 10px 32px rgba(0,0,0,.35), 0 0 0 2px rgba(255,123,37,.4); }
  .search-icon-left { color: #70757a; margin-right: 10px; display: flex; flex-shrink: 0; }
  .search-input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font-size: 14.5px; color: #202124; font-family: inherit;
  }
  .search-input::placeholder { color: #70757a; }
  .mic-btn {
    background: none; border: none; color: #5f6368; padding: 7px; margin-right: 2px;
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    flex-shrink: 0; min-width: 34px; min-height: 34px;
  }
  .search-submit-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none; color: #fff;
    background: linear-gradient(135deg, #ff7b25 0%, #f95716 100%);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(249,87,22,.4); transition: transform .15s ease;
  }
  .search-submit-btn:active { transform: scale(.94); }

  .shortcuts-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 14px;
    width: 100%; max-width: 360px; margin-bottom: 30px;
  }
  .shortcut-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #fff; gap: 7px; }
  .shortcut-item:active { transform: scale(.95); }
  .icon-circle {
    width: 50px; height: 50px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,.28);
  }
  .icon-circle.wikipedia { color: #000; font-family: Georgia, serif; font-weight: bold; font-size: 24px; }
  .icon-circle.facebook { background: #1877f2; color: #fff; }
  .icon-circle.news { background: #ff5722; color: #fff; }
  .shortcut-item span { font-size: 12px; font-weight: 500; text-shadow: 0 2px 4px rgba(0,0,0,.7); }

  .quick-access-section { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; transition: opacity .2s ease, max-height .2s ease; overflow: hidden; }
  .quick-access-section.hidden { display: none; }
  .quick-access-title { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 500; color: rgba(255,255,255,.9); text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  .quick-access-title svg { color: #f97316; flex-shrink: 0; }
  .quick-buttons-row { display: flex; flex-wrap: wrap; gap: 10px; width: 100%; }
  .pill-btn {
    display: flex; align-items: center; gap: 9px; background: rgba(255,255,255,.15);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.25); padding: 9px 16px; border-radius: 22px;
    color: #fff; text-decoration: none; font-size: 13px; font-weight: 500; min-height: 40px;
  }
  .pill-btn:active { transform: scale(.97); }
  .pill-icon { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; flex-shrink: 0; }

  .footer { position: relative; margin-top: 26px; z-index: 2; display: flex; align-items: center; justify-content: center; width: 100%; max-width: 340px; color: rgba(255,255,255,.55); font-size: 12px; }
  .footer-line { flex: 1; height: 1px; background: rgba(255,255,255,.2); }
  .footer-text { padding: 0 14px; letter-spacing: .4px; }

  /* Panel tuỳ chỉnh (trượt từ phải vào) */
  .customize-panel {
    position: fixed; top: 0; right: -320px; width: 300px; height: 100%;
    background: #202124; z-index: 100; padding: 18px 16px;
    box-shadow: -8px 0 24px rgba(0,0,0,.4);
    transition: right .25s cubic-bezier(.2,.9,.3,1);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .customize-panel.open { right: 0; }
  .customize-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .customize-title { font-size: 15px; font-weight: 600; color: #fff; }
  .close-panel-btn { cursor: pointer; color: #9aa0a6; font-size: 16px; padding: 4px 8px; }
  .section-label { display: block; font-size: 12px; font-weight: 600; color: #9aa0a6; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 10px; margin-top: 18px; }
  .section-label:first-of-type { margin-top: 0; }
  .bg-options-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .bg-thumb { width: 100%; aspect-ratio: 1; border-radius: 8px; background-size: cover; background-position: center; cursor: pointer; border: 2px solid transparent; }
  .bg-thumb.active { border-color: #f97316; }
  .custom-url-input {
    width: 100%; margin-top: 10px; background: #2b2e31; border: 1px solid #3c3f42;
    border-radius: 8px; padding: 9px 12px; color: #e8eaed; font-size: 12.5px; outline: none;
  }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
  .toggle-label { font-size: 13.5px; color: #e8eaed; }
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #3c3f42; border-radius: 22px; cursor: pointer; transition: background .15s; }
  .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; }
  .switch input:checked + .slider { background: #f97316; }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .panel-settings-link {
    display: block; margin-top: 22px; padding: 11px; text-align: center;
    border: 1px solid #3c3f42; border-radius: 8px; color: #e8eaed; font-size: 13px;
    cursor: pointer; background: transparent;
  }

  @media (max-width: 340px) {
    .logo-title { font-size: 38px; }
    .shortcuts-grid { max-width: 300px; gap: 16px 10px; }
    .icon-circle { width: 46px; height: 46px; }
  }
</style>
</head>
<body>

<div class="viewport" id="viewport">
  <div class="settings-btn" id="btnSettings" title="Tuỳ chỉnh trang này" aria-label="Tuỳ chỉnh trang này">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </div>

  <!-- Panel tuỳ chỉnh trang chủ (ảnh nền, quick access, độ tối) -->
  <div class="customize-panel" id="customizePanel">
    <div class="customize-header">
      <span class="customize-title">Tuỳ chỉnh trang này</span>
      <span class="close-panel-btn" id="closeCustomizeBtn">✕</span>
    </div>

    <span class="section-label">Hình nền</span>
    <div class="bg-options-grid" id="bgOptions"></div>
    <input type="text" class="custom-url-input" id="customBgInput" placeholder="Hoặc dán URL ảnh tùy chỉnh…" />

    <span class="section-label">Giao diện &amp; Tiện ích</span>
    <div class="toggle-row">
      <span class="toggle-label">Hiện Truy cập nhanh</span>
      <label class="switch">
        <input type="checkbox" id="toggleQuickAccess" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Làm tối nền (Dark overlay)</span>
      <label class="switch">
        <input type="checkbox" id="toggleOverlay" checked />
        <span class="slider"></span>
      </label>
    </div>

    <button type="button" class="panel-settings-link" id="btnOpenBrowserSettings">Cài đặt trình duyệt (tìm kiếm, hồ sơ, API…)</button>
  </div>

  <div class="content-container">
    <div class="logo-container">
      <h1 class="logo-title">Egeo</h1>
      <p class="logo-sub">Tìm kiếm</p>
    </div>

    <form class="search-wrapper" id="homeForm" autocomplete="off">
      <div class="search-box">
        <div class="search-icon-left">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <input type="search" class="search-input" id="homeQ" placeholder="Tìm kiếm hoặc nhập URL" autofocus spellcheck="false" enterkeyhint="search" />
        <button type="button" class="mic-btn" id="btnVoiceHome" title="Tìm bằng giọng nói">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        </button>
        <button type="submit" class="search-submit-btn" title="Tìm kiếm">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </div>
    </form>

    <div class="shortcuts-grid" id="shortcuts"></div>

    <div class="quick-access-section" id="quickAccessSection">
      <div class="quick-access-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
        <span>Truy cập nhanh</span>
      </div>
      <div class="quick-buttons-row" id="chips"></div>
    </div>

    <div class="footer"><div class="footer-line"></div><span class="footer-text">Egeo</span><div class="footer-line"></div></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "egeo_home_prefs_v1";
  var BG_PRESETS = [
    "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1600&q=70",
    "https://images.unsplash.com/photo-1511497584788-8767611136f6?auto=format&fit=crop&w=1600&q=70",
    "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=70",
    "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=70"
  ];

  function loadPrefs() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      return JSON.parse(raw);
    } catch (e) { return {}; }
  }
  function savePrefs(prefs) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs)); } catch (e) {}
  }
  var prefs = loadPrefs();

  function applyBackground(url) {
    document.documentElement.style.setProperty("--bg-url", "url('" + url + "')");
  }
  function applyQuickAccess(show) {
    document.getElementById("quickAccessSection").classList.toggle("hidden", !show);
  }
  function applyOverlay(dark) {
    document.documentElement.classList.toggle("no-overlay", !dark);
  }

  if (prefs.bgUrl) applyBackground(prefs.bgUrl);
  applyQuickAccess(prefs.quickAccess !== false);
  applyOverlay(prefs.overlay !== false);

  // --- Panel tuỳ chỉnh ---
  var bgOptionsRoot = document.getElementById("bgOptions");
  BG_PRESETS.forEach(function (url) {
    var thumb = document.createElement("div");
    thumb.className = "bg-thumb" + (prefs.bgUrl === url || (!prefs.bgUrl && url === BG_PRESETS[0]) ? " active" : "");
    thumb.style.backgroundImage = "url('" + url + "')";
    thumb.addEventListener("click", function () {
      applyBackground(url);
      prefs.bgUrl = url;
      savePrefs(prefs);
      Array.prototype.forEach.call(bgOptionsRoot.children, function (c) { c.classList.remove("active"); });
      thumb.classList.add("active");
    });
    bgOptionsRoot.appendChild(thumb);
  });

  var customBgInput = document.getElementById("customBgInput");
  customBgInput.addEventListener("change", function () {
    var url = customBgInput.value.trim();
    if (!url) return;
    applyBackground(url);
    prefs.bgUrl = url;
    savePrefs(prefs);
    Array.prototype.forEach.call(bgOptionsRoot.children, function (c) { c.classList.remove("active"); });
  });

  var toggleQuickAccess = document.getElementById("toggleQuickAccess");
  toggleQuickAccess.checked = prefs.quickAccess !== false;
  toggleQuickAccess.addEventListener("change", function () {
    applyQuickAccess(toggleQuickAccess.checked);
    prefs.quickAccess = toggleQuickAccess.checked;
    savePrefs(prefs);
  });

  var toggleOverlay = document.getElementById("toggleOverlay");
  toggleOverlay.checked = prefs.overlay !== false;
  toggleOverlay.addEventListener("change", function () {
    applyOverlay(toggleOverlay.checked);
    prefs.overlay = toggleOverlay.checked;
    savePrefs(prefs);
  });

  var panel = document.getElementById("customizePanel");
  document.getElementById("btnSettings").addEventListener("click", function () { panel.classList.add("open"); });
  document.getElementById("closeCustomizeBtn").addEventListener("click", function () { panel.classList.remove("open"); });

  document.getElementById("btnOpenBrowserSettings").addEventListener("click", function () {
    if (window.AndroidBridge && typeof window.AndroidBridge.openSettings === "function") {
      window.AndroidBridge.openSettings();
    }
  });

  // --- Shortcuts & Quick access ---
  var SHORTCUTS = [
    { id: "youtube", label: "YouTube", url: "https://www.youtube.com",
      icon: '<svg width="26" height="26" viewBox="0 0 24 24" fill="#ff0000"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>' },
    { id: "gmail", label: "Gmail", url: "https://mail.google.com",
      icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="#ea4335"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>' },
    { id: "maps", label: "Maps", url: "https://maps.google.com",
      icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="#ea4335"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>' },
    { id: "wikipedia", label: "Wikipedia", url: "https://vi.wikipedia.org", icon: "W", isText: true },
    { id: "facebook", label: "Facebook", url: "https://www.facebook.com",
      icon: '<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>' },
    { id: "news", label: "Tin tức", url: "https://news.google.com",
      icon: '<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>' }
  ];

  var TRENDS = [
    { label: "thời tiết hôm nay", icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6.6 6.6 0 0 0-12.6-1.9A4.6 4.6 0 0 0 6.5 19h11z" fill="rgba(255,255,255,.2)"/><circle cx="12" cy="7" r="2.5" fill="#fde047" stroke="none"/></svg>' },
    { label: "giá vàng", icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fbbf24"><path d="M4 11h16l-2 8H6l-2-8zm1-5h14l1.5 3H3.5L5 6z"/></svg>' },
    { label: "tỷ giá usd", icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 6v12M9.5 9.5c0-1.38 1.12-2 2.5-2s2.5.62 2.5 2c0 2.5-5 2-5 4.5 0 1.38 1.12 2 2.5 2s2.5-.62 2.5-2"/></svg>' },
    { label: "lịch âm hôm nay", icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' }
  ];

  var scRoot = document.getElementById("shortcuts");
  SHORTCUTS.forEach(function (item) {
    var a = document.createElement("a");
    a.href = "#";
    a.className = "shortcut-item";
    var circleClass = "icon-circle" + (item.id === "wikipedia" ? " wikipedia" : item.id === "facebook" ? " facebook" : item.id === "news" ? " news" : "");
    a.innerHTML = '<div class="' + circleClass + '">' + item.icon + '</div><span>' + item.label + "</span>";
    a.addEventListener("click", function (e) { e.preventDefault(); openUrl(item.url); });
    scRoot.appendChild(a);
  });

  var chipsRoot = document.getElementById("chips");
  TRENDS.forEach(function (t) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "pill-btn";
    b.innerHTML = '<span class="pill-icon">' + t.icon + '</span><span>' + t.label + "</span>";
    b.addEventListener("click", function () { doSearch(t.label); });
    chipsRoot.appendChild(b);
  });

  // --- Điều hướng / tìm kiếm thật ---
  function isUrl(str) {
    return /^(https?:\/\/)|^(www\.)|^[a-z0-9-]+(\.[a-z0-9-]+)+(\/|$|\?|:)/i.test(str.trim());
  }
  function openUrl(url) {
    if (window.AndroidBridge && typeof window.AndroidBridge.openUrl === "function") {
      window.AndroidBridge.openUrl(url);
    } else {
      window.open(url, "_blank");
    }
  }
  function doSearch(query) {
    if (window.AndroidBridge && typeof window.AndroidBridge.search === "function") {
      window.AndroidBridge.search(query);
    } else {
      window.open("https://www.google.com/search?q=" + encodeURIComponent(query), "_blank");
    }
  }
  function submitQuery(raw) {
    var q = (raw != null ? raw : homeQ.value).trim();
    if (!q) return;
    if (isUrl(q)) {
      var url = /^https?:\/\//i.test(q) ? q : "https://" + q;
      openUrl(url);
    } else {
      doSearch(q);
    }
  }

  var homeQ = document.getElementById("homeQ");
  document.getElementById("homeForm").addEventListener("submit", function (e) {
    e.preventDefault();
    submitQuery();
  });

  // --- Giọng nói (Web Speech API thật, cần app cấp RECORD_AUDIO) ---
  var recognition = null;
  if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = "vi-VN";
    recognition.interimResults = false;
    recognition.onresult = function (ev) {
      var text = ev.results[0][0].transcript;
      homeQ.placeholder = "Tìm kiếm hoặc nhập URL";
      submitQuery(text);
    };
    recognition.onerror = function () {
      homeQ.placeholder = "Không nhận diện được, thử lại!";
      setTimeout(function () { homeQ.placeholder = "Tìm kiếm hoặc nhập URL"; }, 2000);
    };
    recognition.onend = function () { homeQ.placeholder = "Tìm kiếm hoặc nhập URL"; };
  }
  document.getElementById("btnVoiceHome").addEventListener("click", function () {
    if (!recognition) {
      alert("Thiết bị/WebView này không hỗ trợ nhận dạng giọng nói.");
      return;
    }
    homeQ.placeholder = "Đang lắng nghe…";
    try { recognition.start(); } catch (e) { homeQ.placeholder = "Tìm kiếm hoặc nhập URL"; }
  });

  window.EgeoHome = {
    setQuery: function (t) { homeQ.value = t || ""; }
  };
})();
</script>
</body>
</html>
